*{box-sizing:border-box;margin:0;padding:0}
:root{

  --or:var(--im-gold);--or-d:var(--im-gold-light);--or-b:#E8C97A;
  --rouge:#A32D2D;--rouge-d:#FCEBEB;--rouge-b:#F09595;
  --ff:'DM Sans',system-ui,sans-serif;
}
body{font-family:var(--ff);background:var(--bg);color:var(--t);font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:var(--ff);cursor:pointer;border:none;transition:all .15s}
input,select,textarea{font-family:var(--ff);font-size:12px;background:#fff;border:0.5px solid var(--bd2);border-radius:6px;color:var(--t);padding:7px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--im-teal);box-shadow:0 0 0 2px rgba(15,129,145,0.12)}
input[type=range]{padding:0;background:transparent;border:none;box-shadow:none;accent-color:var(--im-teal)}
input[type=checkbox]{width:auto;accent-color:var(--im-teal)}
.lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;font-weight:500;margin-bottom:6px}
.card{background:#fff;border:0.5px solid var(--bd);border-radius:10px;padding:14px}
.tag{display:inline-flex;align-items:center;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.dv{height:0.5px;background:var(--bd);margin:10px 0}
.btn{font-size:11px;font-weight:500;padding:6px 12px;border-radius:6px}
.bp{background:var(--im-teal);color:#fff}.bp:hover{background:var(--im-teal-dark);transform:translateY(-1px)}
.bg{background:#fff;color:var(--t2);border:0.5px solid var(--bd2)}.bg:hover{background:var(--bg3)}
.bd-btn{background:var(--rouge-d);color:var(--rouge);border:0.5px solid var(--rouge-b)}
.btn-gold{background:var(--im-gold);color:#fff}.btn-gold:hover{background:#B8962A}
@keyframes su{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes sh{0%{background-position:-200% center}100%{background-position:200% center}}
.su{animation:su .25s ease forwards}
.spin{animation:sp .7s linear infinite}
.shimmer{background:linear-gradient(90deg,var(--t3) 0%,var(--im-teal) 50%,var(--t3) 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:sh 1.5s linear infinite}
@media print{
  .no-print{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid}
  nav,footer{display:none!important}
}
</style>

    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="card">

        <div style="background:var(--bg3);border-radius:8px;padding:10px"><p style="font-size:10px;color:var(--t3);margin-bottom:3px">Prix souhaité</p><p style="font-size:18px;font-weight:500">${fmt(LEAD.prixSouhaite)}</p></div>
        <div style="background:var(--im-teal-light);border-radius:8px;padding:10px;border:0.5px solid var(--teal-b)"><p style="font-size:10px;color:var(--im-teal);margin-bottom:3px">Valeur IMMATCH</p><p style="font-size:18px;font-weight:500;color:var(--im-teal-dark)">${fmt(LEAD.valeur_immatch)}</p></div>
      </div>
      ${[["Délai souhaité",LEAD.delai],["Déjà en vente","Non"],["Mission",LEAD.mission],["Travaux",LEAD.travaux],["Budget travaux",fmt(LEAD.budgetTravaux)]].map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid var(--bd)"><span style="font-size:12px;color:var(--t2)">${l}</span><span style="font-size:12px;font-weight:500">${v}</span></div>`).join("")}
    </div>
    <div class="card">
      <div class="lbl">Coordonnées vendeur</div>

      <div style="padding:14px;background:var(--bg3);border-radius:8px;border:1.5px dashed var(--bd2);text-align:center">
        <p style="font-size:13px;margin-bottom:6px">🔒</p>
        <p style="font-size:12px;font-weight:500;color:var(--t);margin-bottom:4px">${affNom()}</p>
        <p style="font-size:11px;color:var(--t3);margin-bottom:10px">Téléphone et email visibles après acceptation du lead</p>
        <p style="font-size:10px;color:var(--t3);margin-bottom:10px">Vos coordonnées ne sont jamais transmises sans votre accord explicite.</p>
        <button class="btn bp no-print" id="btn-accepter2" style="width:100%;padding:9px">✓ Accepter ce lead pour voir les coordonnées</button>
      </div>`:`
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--bd)">
          <span style="font-size:12px;color:var(--t2)">Nom complet</span>
          <span style="font-size:12px;font-weight:500">${affNom()}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--bd)">
          <span style="font-size:12px;color:var(--t2)">Téléphone</span>
          <a href="tel:${LEAD.tel}" style="font-size:12px;font-weight:500;color:var(--im-teal);text-decoration:none">📞 ${affTel()}</a>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--bd)">
          <span style="font-size:12px;color:var(--t2)">Email</span>
          <a href="mailto:${LEAD.email}" style="font-size:12px;font-weight:500;color:var(--im-teal);text-decoration:none">✉️ ${affEmail()}</a>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0">
          <span style="font-size:12px;color:var(--t2)">Adresse</span>
          <span style="font-size:12px;font-weight:500">${affAdresse()}</span>

        <div style="padding:8px;background:var(--im-teal-light);border-radius:8px;border:0.5px solid var(--teal-b);margin-top:4px">
          <p style="font-size:10px;color:var(--im-teal-dark)">✓ Coordonnées débloquées · Lead accepté le ${new Date().toLocaleDateString("fr-FR")}</p>
        </div>
      </div>`}
    </div>
      <p style="font-size:12px;color:var(--t2);line-height:1.7;background:var(--bg3);padding:10px;border-radius:8px;border-left:2px solid var(--im-teal)">"${LEAD.description_libre}"</p>
    </div>
    <div class="card" style="border-color:var(--teal-b);background:linear-gradient(135deg,var(--im-teal-light),#fff 70%)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <div style="width:24px;height:24px;border-radius:50%;background:var(--im-teal);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;flex-shrink:0">IMA</div>
        <div><p style="font-size:11px;font-weight:500;color:var(--im-teal-dark)">Portrait IMA — Mode Accueil</p><p style="font-size:10px;color:var(--t3)">Attachement : <strong>${LEAD.ima_attachment}</strong> · Motivation : <strong>${LEAD.ima_motivation}/100</strong></p></div>
      </div>
      <p style="font-size:12px;color:var(--t2);line-height:1.7;font-style:italic;margin-bottom:10px">"${LEAD.ima_portrait}"</p>
      <div class="dv"></div>
      <p style="font-size:11px;color:var(--t2)"><strong>Acheteur idéal :</strong> ${LEAD.ima_buyer}</p>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn bp" style="flex:1;padding:10px" data-tab="surfaces">📐 Surfaces & Photos</button>
      <button class="btn" style="flex:1;padding:10px;background:var(--im-gold-light);color:#7A5C0A;border:0.5px solid var(--or-b)" data-tab="rapport">→ Rapport</button>
    </div>
  </div>
</div>`;
}

// ONGLET SURFACES & PHOTOS

function tabSurfaces(){

      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <div style="width:22px;height:22px;border-radius:50%;background:var(--im-teal);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff">IMA</div>
        <div><p style="font-size:12px;font-weight:500;color:var(--im-teal-dark)">IMA — Lecture automatique de plan</p><p style="font-size:10px;color:var(--t3)">Photographiez le plan du vendeur · IMA extrait les pièces et surfaces automatiquement</p></div>
      </div>
      ${!S.planPhoto?`
      <label style="display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1.5px dashed var(--or-b);border-radius:8px;cursor:pointer;background:#fff">

        <span style="font-size:12px;font-weight:500;color:var(--or)">Photographier ou importer le plan</span>

      </label>`:""}
      ${S.planPhoto&&S.imaState==="idle"?`
      <div style="display:flex;gap:10px;align-items:center">
        <img src="${S.planPhoto}" style="width:100px;height:80px;object-fit:contain;border-radius:6px;border:0.5px solid var(--bd);background:#fff">
        <div style="flex:1">
          <p style="font-size:12px;font-weight:500;color:var(--im-teal-dark);margin-bottom:6px">✓ Plan importé</p>
          <div style="display:flex;gap:8px">
            <button class="btn bp" id="btn-ima-read" style="flex:1;padding:8px">IMA — Lire le plan</button>
            <button class="btn bg" id="btn-del-plan" style="font-size:10px">Supprimer</button>
          </div>
        </div>
      </div>`:""}
      ${S.imaState==="reading"?`<div style="display:flex;align-items:center;gap:10px;padding:10px;justify-content:center"><div class="spin" style="width:16px;height:16px;border:2px solid var(--teal-b);border-top-color:var(--im-teal);border-radius:50%"></div><span class="shimmer" style="font-size:12px">IMA analyse le plan et extrait les surfaces...</span></div>`:""}
      ${S.imaState==="extracted"?`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:#fff;border-radius:8px"><p style="font-size:12px;font-weight:500;color:var(--im-teal-dark)">✓ ${S.imaExtracted.length} pièces détectées</p><button class="btn bp" id="btn-apply-extract">Intégrer dans le descriptif</button></div>`:""}
    </div>

    <!-- Actions -->
    <div style="display:flex;gap:8px;margin-bottom:10px">

      <button class="btn bg" id="btn-ima-desc" style="display:flex;align-items:center;gap:6px">
        <div style="width:14px;height:14px;border-radius:50%;background:var(--im-teal);display:flex;align-items:center;justify-content:center;font-size:5px;font-weight:700;color:#fff">IMA</div>

      <label class="btn bg" style="cursor:pointer;display:flex;align-items:center;gap:4px">
        📷 Ajouter photos
        <input type="file" id="inp-photos" accept="image/*" multiple capture="environment" style="display:none">
      </label>
    </div>

    <!-- Formulaire ajout pièce -->

      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
        ${TYPES_PIECES.map(t=>`<button data-newtype="${t.id}" style="padding:5px 10px;border-radius:8px;border:0.5px solid ${S.newPieceType===t.id?"var(--im-teal)":"var(--bd2)"};background:${S.newPieceType===t.id?"var(--im-teal)":"#fff"};color:${S.newPieceType===t.id?"#fff":"var(--t2)"};font-size:11px;cursor:pointer;font-family:var(--ff)">${t.i} ${t.l}</button>`).join("")}

        <div><p style="font-size:10px;color:var(--t3);margin-bottom:3px">Surface (m²)</p><input id="new-surface" type="number" step="0.01" placeholder="ex: 14.5"></div>
        <div><p style="font-size:10px;color:var(--t3);margin-bottom:3px">Niveau</p><select id="new-niveau">${NIVEAUX.map(n=>`<option value="${n}">${n}</option>`).join("")}</select></div>
        <div><p style="font-size:10px;color:var(--t3);margin-bottom:3px">État</p><select id="new-etat">${ETATS.map(e=>`<option>${e}</option>`).join("")}</select></div>
        <div><p style="font-size:10px;color:var(--t3);margin-bottom:3px">Sol</p><select id="new-sol">${SOLS.map(s=>`<option>${s}</option>`).join("")}</select></div>
        <div><p style="font-size:10px;color:var(--t3);margin-bottom:3px">Murs</p><select id="new-murs">${MURS.map(m=>`<option>${m}</option>`).join("")}</select></div>

      <div style="margin-bottom:8px"><p style="font-size:10px;color:var(--t3);margin-bottom:3px">Notes / Particularités</p><input id="new-notes" placeholder="PAC, poêle à bois, plancher chauffant, vue..."></div>

      ${S.pieces.filter(p=>p.niveau===n).map(p=>{

            </div>
          </div>
          ${p.expanded?`

              <div><p style="font-size:10px;color:var(--t3);margin-bottom:3px">Murs</p><select data-field="murs" data-id="${p.id}">${MURS.map(m=>`<option ${p.murs===m?"selected":""}>${m}</option>`).join("")}</select></div>
              <div><p style="font-size:10px;color:var(--t3);margin-bottom:3px">Niveau</p><select data-field="niveau" data-id="${p.id}">${NIVEAUX.map(n=>`<option ${p.niveau===n?"selected":""}>${n}</option>`).join("")}</select></div>
            </div>
            <div style="margin-bottom:8px"><p style="font-size:10px;color:var(--t3);margin-bottom:3px">Notes / Particularités</p><input placeholder="PAC, poêle à bois, plancher chauffant, double hauteur..." value="${p.notes}" data-field="notes" data-id="${p.id}"></div>

              :`<label style="display:flex;align-items:center;gap:6px;padding:6px 12px;background:#fff;border:0.5px dashed var(--bd2);border-radius:8px;cursor:pointer;font-size:11px;color:var(--t2);width:fit-content">📷 Ajouter une photo<input type="file" accept="image/*" capture="environment" data-photopce="${p.id}" style="display:none"></label>`}
            </div>

      }).join("")}
    </div>`).join("")}

    <!-- Résultat IMA description -->
    ${S.imaGenState==="generating"?`<div style="display:flex;align-items:center;gap:10px;padding:14px;background:var(--im-teal-light);border-radius:8px;border:0.5px solid var(--teal-b)"><div class="spin" style="width:16px;height:16px;border:2px solid var(--teal-b);border-top-color:var(--im-teal);border-radius:50%"></div><span class="shimmer" style="font-size:12px">IMA rédige la description technique...</span></div>`:""}

    <!-- Galerie photos -->
    ${allPhotos.length>0?`

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
        ${allPhotos.map((ph,i)=>`<div style="position:relative;border-radius:8px;overflow:hidden;border:0.5px solid var(--bd)">

        const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3);
        return `<p style="font-size:10px;color:var(--t3);margin-bottom:4px">${type==="sol"?"Sols":"Murs"}</p>${sorted.map(([m,n])=>`<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="font-size:11px;color:var(--t2)">${m}</span><span style="font-size:10px;color:var(--t3)">${n}p</span></div>`).join("")}<div class="dv"></div>`;
      }).join("")}

      <div class="lbl">État général</div>
      ${ETATS.map(e=>{
        const n=S.pieces.filter(p=>p.etat===e).length;if(!n)return"";
        const pct=Math.round((n/S.pieces.length)*100);
        const col=e==="Excellent"||e==="Bon état"?"var(--im-teal)":e==="Correct"?"var(--im-gold)":"var(--rouge)";
        return `<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="font-size:11px;color:var(--t2)">${e}</span><span style="font-size:10px;color:var(--t3)">${n}p · ${pct}%</span></div><div style="height:3px;background:var(--bg3);border-radius:2px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${col};border-radius:2px"></div></div></div>`;
      }).join("")}
    </div>
  </div>
</div>`;
}

// PARSER SECTIONS
// ════════════════════════════════════════════════════════════
function parseSections(text){
  if(!text)return[];
  const lines=text.split("\n");
  const sections=[];let cur=null;
  lines.forEach(l=>{
    const tr=l.trim().replace(/\*\*/g,"").replace(/^#+\s*/,"");
    if(!tr)return;
    if(tr.match(/^(Concernant|Les axes|Le prix|En résumé)/i)){if(cur)sections.push(cur);cur={t:tr,c:[]};}
    else if(cur){const cl=tr.replace(/\*\*(.*?)\*\*/g,"$1");if(cl)cur.c.push(cl);}
  });
  if(cur)sections.push(cur);
  return sections;
}

  };

  on("btn-accepter2","click",accepterLead);

  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;r()}));

  on("btn-show-add","click",()=>{S.showAddPiece=!S.showAddPiece;r()});

  on("btn-confirm-add","click",()=>{
    const type=document.getElementById("new-type")?.value||S.newPieceType;
    const label=document.getElementById("new-label")?.value;
    const surface=parseFloat(document.getElementById("new-surface")?.value)||0;
    const niveau=document.getElementById("new-niveau")?.value||"RDC";

    S.pieces.push({id:S.nextId++,type,label:label||(tp?tp.l:"Pièce"),surface,niveau,etat,sol,murs,notes,photo:null,expanded:false});
    S.showAddPiece=false;r();
  });
  document.querySelectorAll("[data-newtype]").forEach(b=>b.addEventListener("click",()=>{S.newPieceType=b.dataset.newtype;r()}));
  document.querySelectorAll("[data-expand]").forEach(b=>b.addEventListener("click",e=>{
    const id=+e.currentTarget.dataset.expand;
    S.pieces=S.pieces.map(p=>({...p,expanded:p.id===id?!p.expanded:p.expanded}));r();
  }));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",e=>{
    S.pieces=S.pieces.filter(p=>p.id!==+e.currentTarget.dataset.del);r();
  }));
  document.querySelectorAll("[data-field][data-id]").forEach(inp=>inp.addEventListener("change",e=>{
    const id=+e.target.dataset.id,field=e.target.dataset.field;
    S.pieces=S.pieces.map(p=>p.id===id?{...p,[field]:field==="surface"?parseFloat(e.target.value)||0:e.target.value}:p);r();
  }));
  // Photos pièces
  document.querySelectorAll("[data-photopce]").forEach(inp=>inp.addEventListener("change",e=>{
    const id=+e.target.dataset.photopce,file=e.target.files[0];if(!file)return;
    const reader=new FileReader();reader.onload=ev=>{S.pieces=S.pieces.map(p=>p.id===id?{...p,photo:ev.target.result}:p);r()};reader.readAsDataURL(file);
  }));
  document.querySelectorAll("[data-delpho]").forEach(b=>b.addEventListener("click",e=>{

  document.querySelectorAll("[data-color]").forEach(b=>b.addEventListener("click",e=>{S.agent.couleur=e.currentTarget.dataset.color;r()}));
  document.querySelectorAll("[data-avis-a]").forEach(inp=>inp.addEventListener("input",e=>{S.agent.avis[+e.target.dataset.avisA].a=e.target.value}));
  document.querySelectorAll("[data-avis-r]").forEach(inp=>inp.addEventListener("input",e=>{S.agent.avis[+e.target.dataset.avisR].r=e.target.value}));
  document.querySelectorAll("[data-avis-t]").forEach(inp=>inp.addEventListener("input",e=>{S.agent.avis[+e.target.dataset.avisT].t=e.target.value}));
  on("add-avis","click",()=>{S.agent.avis.push({a:"",r:"Vendeur",t:""});r()});
}

// API ANTHROPIC — IMA VISION (lecture plan)
// ════════════════════════════════════════════════════════════
async function lirePlanIMA(){
  if(!S.planPhoto)return;
  S.imaState="reading";r();
  try{
    const base64=S.planPhoto.split(",")[1];
    const mediaType=S.planPhoto.split(";")[0].split(":")[1];
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mediaType,data:base64}},{type:"text",text:`Analyse ce plan d'appartement ou maison. Extrait TOUTES les pièces avec leurs surfaces.\nRéponds UNIQUEMENT en JSON valide sans texte ni markdown :\n{"pieces":[{"type":"sejour|cuisine|chambre|sdb|wc|entree|couloir|cellier|terrasse|jardin|autre","label":"Nom exact","surface":0.00,"niveau":"RDC"}],"surface_habitable":0.00,"notes":"observations"}`}]}]})});
    const d=await res.json();
    const text=d.content?.[0]?.text||"";
    const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());
    S.imaExtracted=parsed.pieces||[];
    S.imaState="extracted";
  }catch(e){S.imaState="idle";alert("IMA n'a pas pu lire le plan. Essayez avec une image plus nette.");}
  r();
}

// ════════════════════════════════════════════════════════════
// API ANTHROPIC — DESCRIPTION TECHNIQUE
// ════════════════════════════════════════════════════════════
async function genDescriptionIMA(){
  if(!S.pieces.length)return;
  S.imaGenState="generating";r();
  const excl=["terrasse","jardin","garage","cave"];
  const carrez=S.pieces.filter(p=>!excl.includes(p.type)).reduce((a,p)=>a+(parseFloat(p.surface)||0),0);
  const liste=S.pieces.map(p=>`- ${p.label}: ${p.surface}m² · ${p.sol} · ${p.etat}${p.notes?` · ${p.notes}`:""}`).join("\n");
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:400,messages:[{role:"user",content:`Expert immobilier. Rédige une description technique en 3-4 phrases max.\n\nBIEN: ${LEAD.type}, ${LEAD.ville}\nPIÈCES:\n${liste}\nSurface Carrez: ${carrez.toFixed(2)}m²\n\nStyle factuel, professionnel. Commence directement. Mentionne les points forts des matériaux.`}]})});
    const d=await res.json();
    S.imaGenResult=d.content?.[0]?.text||"";
    S.imaGenState="done";
  }catch(e){S.imaGenResult="Erreur. Réessayez.";S.imaGenState="done";}
  r();
}
